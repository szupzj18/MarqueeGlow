name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  package:
    name: swift build + swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  ios:
    name: Build library and example (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Library
        run: |
          xcodebuild -quiet -scheme MarqueeGlow -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Example app
        run: |
          xcodebuild -quiet -project Examples/MarqueeGlowExample/MarqueeGlowExample.xcodeproj \
            -scheme MarqueeGlowExample -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
